spring.application.name=Projekt-arendehantering

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arende}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:arende}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:arende}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# GitHub OAuth2 Login(hide credentials in production)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
logging.level.org.springframework.security=INFO

# Cloudflare R2 Configuration
spring.cloud.aws.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
spring.cloud.aws.credentials.access-key=${S3_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${S3_SECRET_KEY}
spring.cloud.aws.region.static=${S3_REGION:auto}
spring.cloud.aws.s3.path-style-access-enabled=true
app.s3.bucket=${S3_BUCKET:documents}

# Multipart configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# S3 resilience configuration
app.s3.retry.max-attempts=3
app.s3.retry.initial-backoff-ms=200
app.s3.retry.max-backoff-ms=2000
app.s3.failed-delete.batch-size=20
app.s3.failed-delete.retry-delay-seconds=60
app.s3.failed-delete.max-attempts=10
app.s3.failed-delete.scheduler-delay-ms=30000