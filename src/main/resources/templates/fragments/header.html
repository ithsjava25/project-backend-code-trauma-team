<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="app-header">
    <div class="container header-row">
        <div class="brand">
            <a class="brand-link" href="/">Ärendehantering</a>
        </div>

        <nav class="nav">
            <a class="nav-link" href="/ui/cases">Cases</a>
            <a class="nav-link" href="/ui/cases/new">Create</a>
            <a class="nav-link"
               th:if="${currentActor != null && currentActor.role() != null && currentActor.role().toString() == 'MANAGER'}"
               href="/ui/audit">Audit</a>
            <a class="nav-link"
               th:if="${currentActor != null && currentActor.role() != null && currentActor.role().toString() == 'MANAGER'}"
               href="/ui/patients">Manage Patients</a>
            <a class="nav-link"
               th:if="${currentActor != null && currentActor.role() != null && currentActor.role().toString() == 'MANAGER'}"
               href="/ui/employees">Manage Users</a>
        </nav>

        <div class="auth" id="authBar">
            <div th:if="${#authorization.expression('isAuthenticated()')}">
                <span class="auth-label"
                      th:text="${currentActor != null
          ? 'Logged in as: ' + (currentActor.displayName ?: (currentActor.githubUsername ?: currentActor.role))
          : 'Logged in as: ' + '#authentication.name'}">User</span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button class="button button-secondary" type="submit">Logout</button>
                </form>
            </div>
            <div th:unless="${#authorization.expression('isAuthenticated()')}">
                <a th:href="@{/login}" class="button button-secondary">Login</a>
            </div>
        </div>
    </div>
</header>
</body>
</html>
