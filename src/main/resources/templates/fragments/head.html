<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Ärendehantering</title>
    <style th:inline="css">
:root {
  --bg: #0b1020;
  --panel: #101a33;
  --panel2: #0f1730;
  --text: #e7ecff;
  --muted: rgba(231, 236, 255, 0.7);
  --border: rgba(231, 236, 255, 0.12);
  --accent: #6ea8ff;
  --danger: #ff6e8a;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  background: radial-gradient(1200px 700px at 20% 0%, rgba(110, 168, 255, 0.25), transparent 60%),
              radial-gradient(900px 500px at 70% 20%, rgba(142, 97, 255, 0.18), transparent 60%),
              var(--bg);
  color: var(--text);
}

code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
code { color: rgba(231, 236, 255, 0.95); }

.container {
  width: min(1100px, calc(100% - 40px));
  margin: 0 auto;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(11, 16, 32, 0.75);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.header-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 16px;
  align-items: center;
  padding: 14px 0;
}

.brand-link {
  color: var(--text);
  text-decoration: none;
  font-weight: 650;
  letter-spacing: 0.2px;
}

.nav { display: flex; gap: 10px; }
.nav-link {
  color: var(--muted);
  text-decoration: none;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid transparent;
}
.nav-link:hover {
  color: var(--text);
  border-color: var(--border);
  background: rgba(255, 255, 255, 0.03);
}

.auth {
  display: flex;
  gap: 10px;
  align-items: center;
}
.auth-label { font-size: 14px; color: var(--muted); margin-right: 10px; }

.page { padding: 28px 0 40px; }
.page-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { margin: 0 0 10px; font-size: 32px; }
h2 { margin: 0 0 10px; font-size: 18px; }
p { margin: 0 0 14px; color: var(--muted); }
.muted { color: var(--muted); }

.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-top: 18px;
}
.card {
  display: block;
  text-decoration: none;
  color: var(--text);
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.card:hover { border-color: rgba(110, 168, 255, 0.35); }
.card p { margin: 6px 0 0; }

.panel {
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.panel + .panel { margin-top: 14px; }
.panel-error { border-color: rgba(255, 110, 138, 0.35); }

.form { margin-top: 14px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.label { color: var(--muted); font-size: 12px; }
.input {
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  padding: 10px 12px;
  outline: none;
}
textarea.input { padding: 12px; resize: vertical; }
.actions { display: flex; gap: 10px; margin-top: 4px; }

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid rgba(110, 168, 255, 0.55);
  background: rgba(110, 168, 255, 0.18);
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
}
.button:hover { background: rgba(110, 168, 255, 0.25); }
.button-secondary {
  border-color: var(--border);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
}
.button-secondary:hover { background: rgba(255, 255, 255, 0.06); }

.kv {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 10px;
  margin-top: 10px;
}
.k { color: var(--muted); }
.v { overflow: auto; }

.table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
.table th, .table td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.table th {
  font-size: 12px;
  text-transform: uppercase;
  color: var(--muted);
}

.app-footer {
  border-top: 1px solid var(--border);
  padding: 18px 0;
  color: var(--muted);
}
.footer-row { display: flex; justify-content: space-between; align-items: center; }

@media (max-width: 980px) {
  .header-row { grid-template-columns: 1fr; align-items: start; }
  .cards { grid-template-columns: 1fr; }
}
    </style>
</head>
</html>
