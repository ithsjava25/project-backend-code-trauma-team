<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Cases')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">
    <div class="page-title">
        <h1>Cases</h1>
        <a class="button button-secondary" href="/ui/cases/closed" sec:authorize="hasRole('MANAGER')">Closed Cases</a>
        <a class="button" href="/ui/cases/new">Create case</a>
    </div>

    <section class="panel">
        <table class="table" th:if="${not #lists.isEmpty(cases)}">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Created</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${cases}">
                    <td th:text="${c.title}">Title</td>
                    <td th:text="${{c.createdAt}}">Date</td>
                    <td>
                        <span
                                th:if="${currentActor != null && currentActor.role() != null && currentActor.role().toString() == 'PATIENT' && c.status != null && c.status.toString() != 'CREATED'}"
                                class="notice-badge"
                                th:text="'Updated: ' + ${c.status}">
                            Updated
                        </span>
                        <span
                                th:unless="${currentActor != null && currentActor.role() != null && currentActor.role().toString() == 'PATIENT' && c.status != null && c.status.toString() != 'CREATED'}"
                                th:text="${c.status}">
                            CREATED
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/ui/cases/{id}(id=${c.id})}" class="button button-secondary">View</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(cases)}" class="muted">No cases found.</p>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
