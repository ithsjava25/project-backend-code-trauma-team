<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Closed Cases')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">
    <div class="page-title">
        <h1>Closed Cases</h1>
        <a class="button button-secondary" href="/ui/cases">Back to Active Cases</a>
    </div>

    <section class="panel">
        <table class="table" th:if="${not #lists.isEmpty(cases)}">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Created</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${cases}">
                    <td th:text="${c.title}">Title</td>
                    <td th:text="${{c.createdAt}}">Date</td>
                    <td>
                        <a th:href="@{/ui/cases/{id}(id=${c.id})}" class="button button-secondary">View</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(cases)}" class="muted">No closed cases found.</p>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
