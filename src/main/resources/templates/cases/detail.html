<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Case')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">
    <div class="page-title">
        <h1>Case</h1>
        <a class="button button-secondary" href="/ui/cases">Back to list</a>
    </div>

    <section class="panel" th:if="${case != null}">
        <div class="kv">
            <div class="k">Title</div>
            <div class="v" th:text="${case.title}">Title</div>
        </div>
        <div class="kv">
            <div class="k">Description</div>
            <div class="v" th:text="${case.description}">Description</div>
        </div>
        <div class="kv">
            <div class="k">Created At</div>
            <div class="v" th:text="${case.createdAt}">Date</div>
        </div>
    </section>

    <section class="panel" th:if="${case != null}">
        <h2>Notes</h2>
        <div th:each="note : ${case.notes}" class="hint" style="margin-bottom: 10px;">
            <p th:text="${note.content}">Note content</p>
            <div class="muted" style="font-size: 0.8em;">
                <span th:text="${note.authorDisplayName} ?: (${note.authorGithubUsername} ?: ${note.authorRole})">Author</span> - 
                <span th:if="${note.createdAt != null}" th:text="${note.createdAt}">Date</span>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(case.notes)}" class="muted">No notes yet.</p>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;"/>

        <h3>Add Note</h3>
        <form th:action="@{/ui/cases/{id}/notes(id=${case.id})}" method="post" class="form">
            <label class="field">
                <textarea class="input" name="content" rows="3" placeholder="Write a note..." required></textarea>
            </label>
            <div class="actions">
                <button class="button" type="submit">Post Note</button>
            </div>
        </form>
    </section>

    <section class="panel" th:if="${case != null}">
        <h2>Documents</h2>
        <div th:each="doc : ${case.documents}" class="hint" style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <a th:href="@{/ui/cases/{caseId}/documents/{docId}/download(caseId=${case.id}, docId=${doc.id})}" th:text="${doc.fileName}">Document.pdf</a>
                <div class="muted" style="font-size: 0.8em;">
                    <span th:text="${#numbers.formatDecimal(doc.fileSize / 1024.0, 1, 1)} + ' KB'">123.4 KB</span> - 
                    <span th:text="${doc.uploadedAt}">Date</span>
                </div>
            </div>
            <form th:action="@{/ui/cases/{caseId}/documents/{docId}/delete(caseId=${case.id}, docId=${doc.id})}" method="post">
                <button class="button button-secondary" type="submit" onclick="return confirm('Are you sure?')">Delete</button>
            </form>
        </div>
        <p th:if="${#lists.isEmpty(case.documents)}" class="muted">No documents yet.</p>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;"/>

        <h3>Upload Document</h3>
        <form th:action="@{/ui/cases/{id}/documents/upload(id=${case.id})}" method="post" enctype="multipart/form-data" class="form">
            <label class="field">
                <input type="file" name="file" required class="input">
            </label>
            <div class="actions">
                <button class="button" type="submit">Upload</button>
            </div>
        </form>
    </section>
    <section class="panel panel-error" th:if="${case == null}">
        <h2>Error</h2>
        <p>Case not found.</p>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
