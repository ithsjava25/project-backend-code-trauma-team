<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
    <title>Create case</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">
    <div class="page-title">
        <h1>Create case</h1>
        <a class="button button-secondary" href="/ui/cases">Back to list</a>
    </div>

    <form class="form" th:action="@{/ui/cases/new}" th:object="${caseDTO}" method="post">
        <label class="field">
            <span class="label">Title</span>
            <input class="input" th:field="*{title}" maxlength="200" required/>
        </label>
        <label class="field">
            <span class="label">Description</span>
            <textarea class="input" th:field="*{description}" rows="6" required></textarea>
        </label>
        <div class="actions">
            <button class="button" type="submit">Create Case</button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
