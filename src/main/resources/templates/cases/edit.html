<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Edit case')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page">
    <div class="page-title">
        <h1>Edit case</h1>
        <a class="button button-secondary" th:href="@{/ui/cases/{id}(id=${caseId})}">Back to case</a>
    </div>

    <form class="form" th:action="@{/ui/cases/{id}/edit(id=${caseId})}" th:object="${updateCaseForm}" method="post">
        <label class="field">
            <span class="label">Title</span>
            <input class="input" th:field="*{title}" maxlength="200"/>
            <span class="muted" th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color: var(--danger)">Error</span>
        </label>

        <label class="field">
            <span class="label">Description</span>
            <textarea class="input" th:field="*{description}" rows="6"></textarea>
            <span class="muted" th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: var(--danger)">Error</span>
        </label>

        <div class="actions">
            <button class="button" type="submit">Save Changes</button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
