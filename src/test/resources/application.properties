spring.application.name=Projekt-arendehantering-test

# Active profile
spring.profiles.active=test

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create schema on startup
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data-test.sql

# Show SQL in logs for easier debugging during tests
spring.jpa.show-sql=true

# Disable Docker Compose auto-configuration during tests to avoid connection errors in CI
spring.docker.compose.enabled=false

spring.security.oauth2.client.registration.github.client-id=mock-id                                                                                 ?
spring.security.oauth2.client.registration.github.client-secret=mock-secret                                                                 ?
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# AWS S3 Configuration for tests
spring.cloud.aws.s3.endpoint=http://localhost:9000
spring.cloud.aws.credentials.access-key=minioadmin
spring.cloud.aws.credentials.secret-key=minioadmin
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.s3.path-style-access-enabled=true
app.s3.bucket=test-documents
app.s3.retry.max-attempts=2
app.s3.retry.initial-backoff-ms=1
app.s3.retry.max-backoff-ms=5
app.s3.failed-delete.batch-size=10
app.s3.failed-delete.retry-delay-seconds=1
app.s3.failed-delete.max-attempts=3
app.s3.failed-delete.scheduler-delay-ms=1000